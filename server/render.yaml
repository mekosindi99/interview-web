services:
  - type: web
    name: interview-admin-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://interview.sonbola.shop,http://localhost:5173
      - key: DRIVE_FOLDER_ID
        sync: false
